<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipkart Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">Flipkart</div>

    <input type="text" placeholder="Search for products, brands and more">

    <button>Login</button>
</nav>

<section class="categories">
    <div>Mobiles</div>
    <div>Fashion</div>
    <div>Electronics</div>
    <div>Home</div>
    <div>Appliances</div>
    <div>Travel</div>
</section>

<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>iPhone 15</h3>
        <p>₹69,999</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Samsung TV</h3>
        <p>₹34,999</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Laptop</h3>
        <p>₹49,999</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Headphones</h3>
        <p>₹1,999</p>
    </div>

</section>

</body>
</html>
