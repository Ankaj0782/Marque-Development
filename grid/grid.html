<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .container{
    width: 500px;
    height: 500px;
    background-color: aqua;
    display: grid ;
    grid-template-columns: repeat(3,1fr);
    
    gap: 10px;

    
}
    </style>
</head>
<body>
    <div class="container">
        <div id="item1">1</div>
        <div id="item2">2</div>
        <div id="item3">3</div>
        <div id="item4">4</div>
        <div id="item5">5</div>
        <div id="item6">6</div>
        <div id="item7">7</div>
        <div id="item8">8</div>
        <div id="item9">9</div>
        <div id="item10">10</div>
        <div id="item11">11</div>
        <div id="item12">12</div>
        
    </div>
    
</body>
</html>
