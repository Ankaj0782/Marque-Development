<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f4f6;
}

.wrapper{
    background:#8157ab;
    padding:35px;
    border-radius:25px;
}

.card{
    width:340px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 35px rgba(0,0,0,.18);
}

.image-box{
    position:relative;
    width:180px;
    margin:auto;
}

.image-box img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:20px;
}

/* ONLINE DOT */
.online{
    position:absolute;
    right:-10px;
    top:-10px;

    width:22px;
    height:22px;
    border-radius:50%;
    border:4px solid white;

    background:#0b7a17;

    animation:blinkOnline 1.2s infinite ease-in-out;
}

/* Ripple */
.online::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:#33ff55;
    opacity:.5;
    animation:ripple 1.2s infinite;
}

.online::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid #2aff44;
    animation:ripple2 1.2s infinite;
}

@keyframes blinkOnline{

    0%{
        background:#006400;
        box-shadow:
        0 0 5px #006400,
        0 0 10px #006400;
    }

    50%{
        background:#54ff54;
        box-shadow:
        0 0 15px #54ff54,
        0 0 30px #54ff54,
        0 0 45px #54ff54;
    }

    100%{
        background:#006400;
        box-shadow:
        0 0 5px #006400,
        0 0 10px #006400;
    }
}

@keyframes ripple{

    0%{
        transform:scale(1);
        opacity:.6;
    }

    100%{
        transform:scale(2.2);
        opacity:0;
    }
}

@keyframes ripple2{

    0%{
        transform:scale(.8);
        opacity:.8;
    }

    100%{
        transform:scale(2.8);
        opacity:0;
    }
}

h2{
    margin-top:20px;
    font-size:28px;
}

p{
    color:#777;
    margin-top:8px;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin:30px 0;
}

.stats h3{
    font-size:22px;
}

.stats span{
    color:#777;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.follow{
    background:#6a11ff;
    color:white;
}

.message{
    background:#d4d4d4;
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="card">

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500" alt="Profile">

            
            <span class="online"></span>
        </div>

        <h2>Sophia Carter</h2>
        <p>Social Creator</p>

        <div class="stats">
            <div>
                <h3>100</h3>
                <span>Posts</span>
            </div>

            <div>
                <h3>940K</h3>
                <span>Followers</span>
            </div>

            <div>
                <h3>185</h3>
                <span>Following</span>
            </div>
        </div>

        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>

    </div>
</div>

</body>
</html>
