<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px auto;
            
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 150px;
            background-color: aqua;
            transition-property: all;
            transition-duration: 2s;
            transition-delay:1s ;
        }
        .box:hover{
            background-color: blue;
            width: 500px;
            border: 3px solid black;
            border-radius: 30%;
            font-size: 30px;
        }
        
    </style>
</head>
<body>
    <div class="box"><p>Hover to see
the transition.</p></div>
    
    
</body>
</html>
