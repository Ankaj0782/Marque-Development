<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 400px;
            border-radius: 20px;
            box-shadow: 8px 8px 15px gray;
            margin: 5vw auto;
            overflow: hidden; 
            background-color: #c1a4a4;
        }
        .img-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
        }
        
        
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        .details {
            padding: 20px;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        h3 {
            margin: 0 0 15px 0;
            color: #2b2b2b;
        }
        p {
            margin: 0;
            color: #fcf7f7;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <article id="container">
        <section class="img-container">
            <div class="like-box">💗</div>
            <img src="https://wallpapersok.com/images/high/nike-shoes-air-jordan-4-retro-0uo88kxb00ic0cd1.jpg" alt="Nike Jordan">
        </section>
        
        <section class="details">
            <h2>Nike Jordan</h2>
            <h3>$345.00 USD</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic corporis accusantium aspernatur voluptatem, cumque voluptas repellat non fugiat enim illo.</p>
        </section>
    </article>

</body>
</html>
