<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Card</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f2f2f2;
        }

        .card{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:5px 5px 15px gray;
            text-align:center;
        }

        .profile{
            width:120px;
            height:120px;
            border-radius:50%;
            box-shadow: 2px 2px 6px gray;
            object-fit:cover;
        }

        h2{
            margin-top:15px;
            color:#333;
        }

        p{
            color:gray;
            margin-top:5px;
        }

        .icons{
            margin-top:20px;
        }

        .icons i{
            width:40px;
            height:40px;
            line-height:40px;
            background:#f2f2f2;
            border-radius:50%;
            box-shadow: 4px 6px 12px gray;
            margin:0 8px;
            cursor:pointer;
        }

        .buttons{
            margin-top:25px;
        }

        .buttons button{
            padding:10px 20px;
            margin:0 8px;
            border:none;
            background:#eaeaea;
            border-radius:8px;
            box-shadow:4px 7px 14px #555;
            cursor:pointer;
            font-size:16px;
        }

        .stats{
            margin-top:25px;
            display:flex;
            justify-content:space-around;
            color:#555;
        }

    </style>

</head>

<body>

    <div class="card">

        <img src="https://www.billboard.com/wp-content/uploads/media/13-reasons-why-cast-psa-2018-billboard-1548.jpg" class="profile">

        <h2>Hannah-Baker</h2>

        <p>Actress</p>

        <div class="icons">

            <i class="fa-brands fa-facebook-f" style="color: blue;"></i>
            <i class="fa-brands fa-x-twitter" style="color: #333;"></i>
            <i class="fa-brands fa-instagram" style="color: #E1306C;"></i>
            <i class="fa-brands fa-youtube" style="color: red;"></i>

        </div>

        <div class="buttons">

            <button>Message</button>
            <button>Subscribe</button>

        </div>

        <div class="stats">

            <div>❤ 20.4k</div>
            <div>💬 14.3k</div>
            <div>↪ 12.8k</div>

        </div>

    </div>

</body>
</html>
